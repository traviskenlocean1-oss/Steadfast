<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Yellowtail&family=Kaushan+Script&family=Barlow+Condensed:wght@700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0e0e0e;color:#f4f1ea;font-family:'Barlow Condensed',sans-serif}
.row{display:flex;gap:40px;padding:40px;align-items:center;justify-content:center}
.badge{position:relative;width:860px;height:300px;border:12px solid currentColor;border-radius:110px;display:flex;align-items:center;overflow:visible}
.badge .tag{position:absolute;right:54px;top:46px;font-size:36px;line-height:.95;letter-spacing:.01em;text-transform:uppercase;text-align:right;width:230px}
.badge .word{position:absolute;left:30px;bottom:-30px;font-size:178px;line-height:1;transform:rotate(-6deg);transform-origin:left bottom}
.y .word{font-family:'Yellowtail'} .k .word{font-family:'Kaushan Script';font-size:150px;bottom:-12px}
.nav{display:flex;align-items:center;background:#f4f1ea;color:#0e0e0e;height:60px}
.nav .ico{width:60px;height:60px;background:#e3492b;color:#0e0e0e;display:flex;align-items:center;justify-content:center}
.nav .ico svg{width:34px;height:34px}.nav span{padding:0 22px;font-size:22px;border-left:1px solid #0e0e0e;line-height:60px}
.cap{font:14px Arial;color:#888;text-align:center}
